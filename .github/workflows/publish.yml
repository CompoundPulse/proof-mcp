# Publish proof-mcp to npm on every version tag.
#
# Uses npm Trusted Publishing (OIDC): GitHub proves the workflow's identity to
# npm directly, so there is NO token to store and NO one-time code to type. That
# is the point — publishing was blocked for days because the account runs
# `two-factor auth: auth-and-writes`, which demands a TOTP code on every single
# publish from a laptop. A tag push has no authenticator app to read from.
#
# ONE-TIME SETUP (browser, ~30 seconds):
#   npmjs.com -> proof-mcp -> Settings -> Trusted Publisher -> GitHub Actions
#     Organization or user : CompoundPulse
#     Repository           : proof-mcp
#     Workflow filename    : publish.yml
#
# Then to ship any future version:
#   npm version patch && git push --follow-tags
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # required for trusted publishing

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      # npm >=11.5.1 is what understands OIDC trusted publishing.
      - run: npm install -g npm@latest
      - run: npm publish --access public
