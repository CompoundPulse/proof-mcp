# Publish proof-mcp to npm on every version tag.
#
# Uses npm Trusted Publishing (OIDC): GitHub proves the workflow's identity to
# npm directly, so there is NO token to store and NO one-time code to type. That
# is the point — publishing was blocked for days because the account runs
# `two-factor auth: auth-and-writes`, which demands a TOTP code on every single
# publish from a laptop. A tag push has no authenticator app to read from.
#
# You do NOT need to weaken 2FA for this. npm's own guidance is the opposite:
# "Require two-factor authentication and disallow tokens" forbids long-lived
# tokens so publish authority flows ONLY through CI's OIDC. Leave the
# "Require two-factor authentication for write actions" box CHECKED.
#
# ONE-TIME SETUP (browser — your security key works fine here, no 6-digit code):
#   npmjs.com/package/proof-mcp/access  ->  Trusted Publisher  ->  GitHub Actions
#     Organization or user : CompoundPulse
#     Repository           : proof-mcp
#     Workflow filename    : publish.yml
#     Environment          : (leave blank)
#
# Then to ship any version, now and forever:
#   npm version patch && git push --follow-tags
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # required for trusted publishing

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing REQUIRES Node >=22.14.0 and npm >=11.5.1.
          # Node 20 (the usual default) silently lacks OIDC support and the
          # publish fails with ENEEDAUTH, which reads like a credentials
          # problem rather than a runtime-version one.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: node -v && npm -v          # proof the OIDC-capable versions are in use
      - run: npm publish --access public
